<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="author" content="يونس البحر / Younes AL-Bahar">
<title>لوحة إدارة المنتجات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#3E1F47;--blush:#F7ECEF;--gold:#B7862F;--ink:#2A2230;--line:#E6D9DE}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);background:var(--blush)}
button,input,select,textarea{font:inherit}
.btn{background:var(--plum);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.g{background:var(--gold)}.btn.o{background:#fff;color:var(--plum);border:1px solid var(--plum)}.btn.r{background:#a33}
input,select,textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#login{max-width:340px;margin:18vh auto;background:#fff;padding:26px;border-radius:14px;display:grid;gap:12px;border:1px solid var(--line)}
#login h1{margin:0;font-size:19px}
#app{display:none;padding:16px;max-width:1100px;margin:auto}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tb input{flex:1;min-width:180px;width:auto}
.wrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
td.nw{white-space:nowrap}
td small{display:block;color:#6b5b70}
.miss{color:#a33}
.btn.s{padding:6px 12px;font-size:13px}
.acts{display:flex;gap:6px}
th{background:#faf3f5;position:sticky;top:0}
td img{width:38px;height:38px;object-fit:contain}
.off{opacity:.5}
dialog{border:0;border-radius:14px;width:min(600px,94vw);padding:20px}
dialog::backdrop{background:#2A223088}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:grid;gap:4px;font-size:13px;font-weight:600}
.fg .w{grid-column:1/-1}
#st{position:fixed;bottom:16px;inset-inline:16px;max-width:420px;margin:auto;background:var(--plum);color:#fff;padding:12px 16px;border-radius:10px;display:none;text-align:center}
@media(max-width:520px){.fg{grid-template-columns:1fr}}
</style>
</head>
<body>
<form id="login">
  <h1>إدارة المنتجات</h1>
  <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
  <button class="btn" type="submit">دخول</button>
  <small id="le" style="color:#a33"></small>
</form>

<div id="app">
  <div class="tb">
    <input id="s" type="search" placeholder="ابحث بالاسم أو الباركود أو الماركة">
    <button class="btn g" id="add">+ منتج جديد</button>
    <button class="btn o" id="imp">استيراد Excel</button>
    <button class="btn o" id="exp">تصدير Excel</button>
    <button class="btn o" id="out">خروج</button>
    <input type="file" id="f" accept=".xlsx,.xls,.csv" hidden>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>صورة</th><th>الباركود</th><th>المنتج</th><th>الماركة</th><th>التصنيف</th><th></th></tr></thead>
    <tbody id="tb"></tbody>
  </table></div>
  <p id="cnt" style="color:#6b5b70"></p>
  <p style="text-align:center;font-size:13px;color:#6b5b70">تصميم وبرمجة: <b style="color:var(--plum)">يونس البحر</b> · Design &amp; development: <b style="color:var(--plum)">Younes AL-Bahar</b></p>
</div>

<dialog id="dlg"><form method="dialog" id="fm">
  <div class="fg">
    <label>الباركود<input name="barcode"></label>
    <label>الماركة بالعربية<input name="brand_ar" required></label>
    <label>Brand in English<input name="brand_en" dir="ltr" required></label>
    <label>التصنيف بالعربية<input name="category_ar" required></label>
    <label>Category in English<input name="category_en" dir="ltr" required></label>
    <label class="w">الحالة<select name="active"><option value="TRUE">ظاهر</option><option value="FALSE">مخفي</option></select></label>
    <label>الاسم بالعربية<input name="name_ar" required></label>
    <label>Name in English<input name="name_en" dir="ltr"></label>
    <label class="w">رابط الصورة<input name="image" dir="ltr" placeholder="https://..."></label>
    <label>الوصف بالعربية<textarea name="description_ar" rows="2"></textarea></label>
    <label>Description in English<textarea name="description_en" rows="2" dir="ltr"></textarea></label>
  </div>
  <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
    <button class="btn o" type="button" id="cx">إلغاء</button>
    <button class="btn" type="submit">حفظ</button>
  </div>
</form></dialog>
<div id="st" role="status"></div>

<script>
const API='https://script.google.com/macros/s/AKfycbw9eTcGMp7MyLTrRdzr_86tLuNCPBZQ5DHCVZQLyjday8cCdncijRUWz5R9wQf00fl7/exec';
const COLS=['id','barcode','brand_ar','brand_en','category_ar','category_en','name_ar','name_en','description_ar','description_en','image','active'];
const $=id=>document.getElementById(id);
const lib=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P=[],pw=sessionStorage.getItem('pw')||'',editId='';

function toast(m,ms=2500){const s=$('st');s.textContent=m;s.style.display='block';clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>s.style.display='none',ms)}
async function post(body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({password:pw,...body})});
  const d=await r.json();if(!d.ok)throw new Error(d.error||'خطأ');return d;
}
async function load(){
  const d=await (await fetch(API)).json();
  P=(d.products||[]).filter(p=>p.id).map(p=>({...p,id:String(p.id),barcode:String(p.barcode||'')}));render();
}
const bi=(a,e)=>(a||e)?`${esc(a)||'<span class="miss">—</span>'}<small dir="ltr">${esc(e)||'<span class="miss">—</span>'}</small>`:'<span class="miss">—</span>';
function render(){
  const q=$('s').value.trim().toLowerCase();
  const l=P.filter(p=>!q||COLS.map(c=>p[c]).join(' ').toLowerCase().includes(q));
  $('tb').innerHTML=l.slice(0,200).map(p=>`<tr class="${String(p.active).toLowerCase()==='false'?'off':''}"><td>${p.image?`<img src="${esc(p.image)}" alt="">`:''}</td><td class="nw">${esc(p.barcode)}</td><td>${bi(p.name_ar,p.name_en)}</td><td>${bi(p.brand_ar,p.brand_en)}</td><td>${bi(p.category_ar,p.category_en)}</td>
  <td class="nw"><div class="acts"><button class="btn o s" data-e="${esc(p.id)}">تعديل</button><button class="btn r s" data-d="${esc(p.id)}">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;padding:30px">لا توجد منتجات. أضف منتجاً أو استورد ملف Excel.</td></tr>';
  $('cnt').textContent=`${l.length} من ${P.length} منتج`+(l.length>200?' — يعرض أول 200، استخدم البحث للباقي':'');
}
function enter(){$('login').style.display='none';$('app').style.display='block';load().catch(()=>toast('تعذر تحميل المنتجات',0))}

$('login').onsubmit=async e=>{
  e.preventDefault();pw=$('pw').value;$('le').textContent='';
  try{await post({action:'check'});sessionStorage.setItem('pw',pw);enter()}catch(x){$('le').textContent=x.message}
};
$('out').onclick=()=>{sessionStorage.removeItem('pw');location.reload()};
let dt;$('s').oninput=()=>{clearTimeout(dt);dt=setTimeout(render,180)};

$('add').onclick=()=>{editId='';$('fm').reset();$('dlg').showModal()};
$('cx').onclick=()=>$('dlg').close();
$('tb').onclick=async e=>{
  const ed=e.target.dataset.e,dl=e.target.dataset.d;
  if(ed){const p=P.find(x=>x.id===ed);editId=ed;$('fm').reset();[...$('fm').elements].forEach(el=>{if(el.name&&p[el.name]!==undefined)el.value=String(p[el.name]).toUpperCase()==='FALSE'&&el.name==='active'?'FALSE':(el.name==='active'?'TRUE':p[el.name])});$('dlg').showModal()}
  if(dl&&confirm('حذف هذا المنتج نهائياً؟')){try{toast('جاري الحذف...',0);await post({action:'delete',ids:[dl]});P=P.filter(x=>x.id!==dl);render();toast('تم الحذف')}catch(x){toast(x.message)}}
};
$('fm').onsubmit=async e=>{
  const p=Object.fromEntries(new FormData($('fm')));p.id=editId;p.barcode=String(p.barcode||'').replace(/\s/g,'');
  try{toast('جاري الحفظ...',0);await post({action:'save',products:[p]});await load();toast('تم الحفظ')}catch(x){toast(x.message)}
};

$('exp').onclick=async()=>{await lib();
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(P.map(p=>Object.fromEntries(COLS.map(c=>[c,p[c]??'']))),{header:COLS}),'Products');
  XLSX.writeFile(wb,'products.xlsx');
};
$('imp').onclick=()=>$('f').click();
$('f').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;e.target.value='';
  try{
    await lib();const wb=XLSX.read(await file.arrayBuffer());
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
    const items=rows.map(r=>{
      const p={};COLS.forEach(c=>p[c]=String(r[c]??'').trim());
      if(!p.brand_ar)p.brand_ar=String(r.brand??'').trim();
      if(!p.category_ar)p.category_ar=String(r.category??'').trim();
      if(!p.id){const m=p.barcode&&P.find(x=>x.barcode===p.barcode);if(m)p.id=m.id}
      if(!p.active)p.active='TRUE';return p;
    }).filter(p=>p.name_ar||p.name_en);
    if(!items.length)return toast('لم أجد منتجات في الملف. تأكد من أسماء الأعمدة.',4000);
    if(!confirm(`استيراد ${items.length} منتج؟ المنتجات ذات الباركود الموجود ستُحدَّث.`))return;
    for(let i=0;i<items.length;i+=40){toast(`جاري الاستيراد ${Math.min(i+40,items.length)} / ${items.length}`,0);await post({action:'save',products:items.slice(i,i+40)})}
    await load();toast('تم الاستيراد');
  }catch(x){toast(x.message,4000)}
};
if(pw)post({action:'check'}).then(enter).catch(()=>{});
</script>
</body>
</html>
